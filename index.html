<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>

    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- Marked.js for rendering Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Prism.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        MathJax = {
            tex: {
                packages: { '[+]': ['base', 'ams', 'color'] }, // Ensure required packages are included
                inlineMath: [['$', '$'], ['\\(', '\\)']], // Inline math delimiters
                displayMath: [['$$', '$$'], ['\\[', '\\]']], // Display math delimiters
            },
            loader: {
                load: ['[tex]/color', '[tex]/ams'] // Load color and AMS packages
            },
        };
    </script>

    <!-- Custom styles -->
    <link rel="stylesheet" id="17291729" data-theme="true" href="styles/DarkThemes/earthly.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        p img {
            max-width: 50%;
            height: auto;
            display: block;
            margin: 20px auto;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>

    <link rel="stylesheet" href="generalstyle.css">
</head>

<body>
    <div class="title">
        <p></p>
        <div id="themes">
            <label for="theme-type">Choose Theme</label>
            <select id="theme-type">
                <option value="DarkDefault">DarkDefault</option>
                <option value="DarkSunset">DarkSunset</option>
                <option value="DarkMordernMinimal">DarkMordernMinimal</option>
                <option value="Darkmonochrome">Darkmonochrome</option>
                <option value="DarkEarthly">DarkEarthly</option>
                <option value="DarkOceanBreeze">DarkOceanBreeze</option>
                <!--                 <option value="LightDefault">LightDefault</option>
                <option value="LightSunset">LightSunset</option>
                <option value="LightMordernMinimal">LightMordernMinimal</option>
                <option value="Lightmonochrome">Lightmonochrome</option>
                <option value="LightEarthly">LightEarthly</option>
                <option value="LightOceanBreeze">LightOceanBreeze</option> -->
            </select>
        </div>
        <div id="fonts">
            <label for="font-type">Choose Fonts</label>
            <select id="font-type">
                <option value="'Merriweather', serif">Merriweather</option>
                <option value="'Playfair Display', serif">Playfair Display</option>
                <option value="'Lora', serif">Lora</option>
                <option value="'Roboto Slab', serif">Roboto Slab</option>
                <option value="'Roboto', sans-serif">Roboto</option>
                <option value="'Open Sans', sans-serif">Open Sans</option>
                <option value="'Lato', sans-serif">Lato</option>
                <option value="'Work Sans', sans-serif">Work Sans</option>
                <option value="'Poppins', sans-serif">Poppins</option>
                <option value="'Raleway', sans-serif">Raleway</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
            </select>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hello! How can I assist you today?</div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." />
            <button id="send-button" class="send-button"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="themeSwticher.js"></script>

</body>

</html>
